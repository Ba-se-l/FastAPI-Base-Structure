# Request definition: subject, object (resource), action
[request_definition]
r = sub, obj, act

# Policy definition: subject (role or user:<id>), object, action
[policy_definition]
p = sub, obj, act

# Role hierarchy definition: member, role
[role_definition]
g = _, _

# Policy effect: allow if any matching rule evaluates to allow
[policy_effect]
e = some(where (p.eft == allow))

# Matcher definition: evaluates role inheritance and wildcards on resource and action
[matchers]
m = g(r.sub, p.sub) && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")
